spring.cloud.gateway.routes[6].id=organizer-service
spring.cloud.gateway.routes[6].uri=lb://organizer-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/organizer/**
spring.cloud.gateway.routes[6].filters[0]=JwtAuthFilter

spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOriginPatterns=http://localhost:3000,http://127.0.0.1:3000
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowCredentials=true
